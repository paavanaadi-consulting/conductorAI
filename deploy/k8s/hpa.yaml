# =============================================================================
# ConductorAI - HorizontalPodAutoscaler
# =============================================================================
# Scales the ConductorAI Deployment between 2 and 10 replicas based on
# average CPU utilization targeting 70%.
#
# Requires the Metrics Server to be installed in the cluster:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: conductorai
  namespace: conductorai
  labels:
    app: conductorai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: conductorai
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
