# =============================================================================
# ConductorAI - Service
# =============================================================================
# ClusterIP service exposing ConductorAI within the cluster on port 8080.
# For external access, place an Ingress or LoadBalancer in front.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: conductorai
  namespace: conductorai
  labels:
    app: conductorai
spec:
  type: ClusterIP
  selector:
    app: conductorai
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
